{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FoodOTG | Rider Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/business_dashboard_styles.css' %}">
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h2>Rider Dashboard</h2>
            <p class="subtitle">View your assigned delivery orders</p>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="section">
        <h3>Assigned Orders</h3>
        <div id="ordersList" class="grid"></div>
    </div>
</div>

<script>
function getAccessToken() {
    return localStorage.getItem("token") || localStorage.getItem("access");
}

function authHeaders() {
    return {
        "Authorization": "Bearer " + getAccessToken()
    };
}

if (!getAccessToken()) {
    window.location.href = "/login/";
}

if (localStorage.getItem("role") !== "rider") {
    alert("Access denied. Rider only.");
    window.location.href = "/login/";
}

async function loadOrders() {
    const container = document.getElementById("ordersList");

    try {
        const response = await fetch("/api/rider/orders/", {
            headers: authHeaders()
        });

        const orders = await response.json();

        if (!response.ok) {
            container.innerHTML = `<div class="empty-state">${orders.error || "Failed to load orders."}</div>`;
            return;
        }

        container.innerHTML = "";

        if (!orders.length) {
            container.innerHTML = `<div class="empty-state">No assigned orders yet.</div>`;
            return;
        }

        orders.forEach(order => {
            container.innerHTML += `
                <div class="card">
                    <div class="card-body">
                        <h4>Order #${order.id}</h4>
                        <p><strong>Customer:</strong> ${order.customer}</p>
                        <p><strong>Restaurant:</strong> ${order.restaurant_name}</p>
                        <p><strong>Address:</strong> ${order.restaurant_address}</p>
                        <p><strong>Status:</strong> ${order.status}</p>
                        <p><strong>Total:</strong> ৳${order.total_amount}</p>
                    </div>
                </div>
            `;
        });
    } catch (error) {
        container.innerHTML = `<div class="empty-state">Server communication error.</div>`;
    }
}

function logout() {
    localStorage.clear();
    window.location.href = "/login/";
}

loadOrders();
</script>

</body>
</html>
