{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FoodOTG | Business Login</title>
    <link rel="stylesheet" href="{% static 'css/business_login_styles.css' %}">
</head>
<body>

<div class="container">
    <h2>Business Owner Login</h2>

    <div id="msg" class="error"></div>

    <div class="input-group">
        <input type="text" id="username" placeholder="Email Address">
    </div>

    <div class="input-group">
        <input type="password" id="password" placeholder="Password">
    </div>

    <button onclick="loginBusiness()">Login</button>

    <p class="footer-text">
        <a href="/forgot-password/">Forgot Password?</a>
    </p>

    <p class="footer-text">
        Don’t have an account? <a href="/business-register/">Register</a>
    </p>
</div>

<script>
async function loginBusiness() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const msg = document.getElementById("msg");

    msg.innerText = "";

    if (!username || !password) {
        msg.innerText = "All fields must be filled.";
        return;
    }

    try {
        const response = await fetch("/api/login/", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok || !data.access) {
            msg.innerText = data.error || "Login failed.";
            return;
        }

        if (data.role !== "business_owner") {
            msg.innerText = "This account is not registered as a business owner.";
            return;
        }

        localStorage.setItem("token", data.access);
        localStorage.setItem("refresh", data.refresh);
        localStorage.setItem("role", data.role);

        window.location.href = "/business-dashboard/";

    } catch (error) {
        msg.innerText = "Server communication error.";
    }
}
</script>

</body>
</html>
