{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodOTG | Forgot Password</title>
    <link rel="stylesheet" href="{% static 'css/forgot_password_styles.css' %}">
</head>
<body>

<div class="page-wrapper">
    <div class="card">
        <div class="icon-circle">🔐</div>

        <h2>Forgot Password?</h2>
        <p class="subtitle">
            Enter your email address and we’ll send you a reset link.
        </p>

        <div id="msg" class="message"></div>

        <div class="input-group">
            <input type="email" id="email" placeholder="Enter your email">
        </div>

        <button onclick="sendLink()">Send Reset Link</button>

        <p class="back-link">
            Remember password? <a href="/login/">Back to Login</a>
        </p>
    </div>
</div>

<script>
async function sendLink() {
    const email = document.getElementById("email").value.trim();
    const msg = document.getElementById("msg");

    msg.innerText = "";
    msg.className = "message";

    if (!email) {
        msg.innerText = "Please enter your email address.";
        msg.classList.add("error");
        return;
    }

    try {
        const res = await fetch("/api/forgot-password/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email })
        });

        const data = await res.json();

        if (res.ok) {
            msg.innerText = data.message || "Reset link sent successfully.";
            msg.classList.add("success");
        } else {
            msg.innerText = data.error || "Email not found.";
            msg.classList.add("error");
        }

    } catch (error) {
        msg.innerText = "Server communication error.";
        msg.classList.add("error");
    }
}
</script>

</body>
</html>
