{% load static %}
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoodOTG | Checkout</title>
  <link rel="stylesheet" href="{% static 'css/checkout_styles.css' %}" />
</head>

<body>
  <div class="checkout-page">
    <div class="checkout-card">
      <div class="checkout-header">
        <div>
          <h1>Checkout</h1>
          <p>Review your order and add billing details.</p>
        </div>

        <button class="secondary-btn" type="button" onclick="window.location.href = '/customer-dashboard/'">
          Back
        </button>
      </div>

      <div id="message" class="message-box"></div>
      <div id="checkoutContent">
        <p class="loading-text">Loading checkout summary...</p>
      </div>
    </div>
  </div>

  <script>
    function getAccessToken() {
      return localStorage.getItem("token") || localStorage.getItem("access");
    }

    if (!getAccessToken()) {
      window.location.href = "/customer-login/";
    }

    const token = getAccessToken();

    function escapeHtml(text) {
      return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    async function loadCheckoutSummary() {
      const content = document.getElementById("checkoutContent");

      try {
        const response = await fetch("/api/checkout/summary/", {
          headers: {
            Authorization: "Bearer " + token,
            Accept: "application/json",
          },
        });

        const data = await response.json();

        if (!response.ok) {
          content.innerHTML = `<div class="empty-box">${escapeHtml(data.error || "Failed to load checkout summary.")}</div>`;
          return;
        }

        const cart = data.cart;
        const items = cart.items || [];

        if (!items.length) {
          content.innerHTML = `<div class="empty-box">Your cart is empty.</div>`;
          return;
        }

        const itemsHtml = items.map((item) => `
          <div class="checkout-item">
            <div class="checkout-item-info">
              <h3>${escapeHtml(item.menu_item_name)}</h3>
              <p>${escapeHtml(item.restaurant_name)}</p>
              <small>৳${item.price} x ${item.quantity}</small>
            </div>
            <div class="checkout-item-total">৳${item.subtotal}</div>
          </div>
        `).join("");

        content.innerHTML = `
          <div class="summary-grid">
            <div class="summary-box">
              <h3>Restaurant</h3>
              <p>${escapeHtml(data.restaurant_name)}</p>
            </div>

            <div class="summary-box">
              <h3>Cart Summary</h3>
              <p>Total Items: ${cart.total_items}</p>
              <p>Subtotal: ৳${data.subtotal}</p>
              <p>Delivery Charge: ৳${data.delivery_charge}</p>
            </div>
          </div>

          <div class="items-wrapper">
            ${itemsHtml}
          </div>
          <div style="
  margin-top:25px;
  padding:22px;
  background:#ffffff;
  border:1px solid #e6ebf2;
  border-radius:18px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
">
  <h3 style="grid-column:1 / -1; font-size:24px; margin-bottom:6px;">
    Billing Details
  </h3>

  <input
    type="text"
    id="customer_name"
    placeholder="Full Name"
    required
    style="width:100%; padding:14px 15px; border:1px solid #dbe3ec; border-radius:12px; background:#f8fafc; font-size:15px;"
  />

  <input
    type="text"
    id="phone_number"
    placeholder="Phone Number"
    required
    style="width:100%; padding:14px 15px; border:1px solid #dbe3ec; border-radius:12px; background:#f8fafc; font-size:15px;"
  />

  <textarea
    id="delivery_address"
    placeholder="Delivery Address"
    required
    style="grid-column:1 / -1; width:100%; min-height:75px; padding:14px 15px; border:1px solid #dbe3ec; border-radius:12px; background:#f8fafc; font-size:15px; resize:vertical;"
  ></textarea>

  <select
    id="payment_method"
    style="grid-column:1 / -1; width:100%; padding:14px 15px; border:1px solid #dbe3ec; border-radius:12px; background:#f8fafc; font-size:15px;"
  >
    <option value="Cash on Delivery">Cash on Delivery</option>
    <option value="Online Payment">Online Payment</option>
  </select>
</div>

          <div class="checkout-footer">
            <div>
              ${data.applied_deal ? `
                <p class="total-label">Applied Deal</p>
                <div class="discount-line">${escapeHtml(data.applied_deal)}</div>
              ` : ""}

              <p class="total-label">Subtotal</p>
              <div class="subtotal-line">৳${data.subtotal}</div>

              <p class="total-label">Discount</p>
              <div class="discount-line">-৳${data.discount_amount}</div>

              <p class="total-label">Delivery Charge</p>
              <div class="subtotal-line">৳${data.delivery_charge}</div>

              <p class="total-label">Grand Total</p>
              <div class="grand-total">৳${data.final_total}</div>
            </div>

            <div class="action-group">
              <button class="secondary-btn" type="button" onclick="window.location.href='/customer-dashboard/'">
                Back
              </button>
              <button class="primary-btn" type="button" onclick="placeOrder()">
                Place Order
              </button>
            </div>
          </div>
        `;
      } catch (error) {
        content.innerHTML = `<div class="empty-box">Server communication error.</div>`;
      }
    }

    async function placeOrder() {
      const message = document.getElementById("message");

      const customer_name = document.getElementById("customer_name").value.trim();
      const phone_number = document.getElementById("phone_number").value.trim();
      const delivery_address = document.getElementById("delivery_address").value.trim();
      const payment_method = document.getElementById("payment_method").value;

      if (!customer_name || !phone_number || !delivery_address) {
        message.innerHTML = `<p class="error-text">All billing fields are required.</p>`;
        return;
      }

      try {
        const response = await fetch("/api/orders/place/", {
          method: "POST",
          headers: {
            Authorization: "Bearer " + token,
            "Content-Type": "application/json",
            Accept: "application/json",
          },
          body: JSON.stringify({
            customer_name,
            phone_number,
            delivery_address,
            payment_method,
          }),
        });

        const data = await response.json();

        if (response.ok) {
          message.innerHTML = `<p class="success-text">Order placed successfully.</p>`;
          window.location.href = data.redirect_url;
        } else {
          message.innerHTML = `<p class="error-text">${escapeHtml(data.error || "Failed to place order.")}</p>`;
        }
      } catch (error) {
        message.innerHTML = `<p class="error-text">Server communication error.</p>`;
      }
    }

    loadCheckoutSummary();
  </script>
</body>

</html>
