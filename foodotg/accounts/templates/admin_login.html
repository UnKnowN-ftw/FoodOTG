{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodOTG | Admin Login</title>
    <link rel="stylesheet" href="{% static 'css/admin_login_styles.css' %}" />
  </head>
  <body>
    <div class="login-container">
      <h2>Admin Login</h2>

      <p id="msg" class="error"></p>

      <form id="adminLoginForm">
        <input
          type="text"
          id="username"
          placeholder="Admin Email / Username"
          required
        />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
    </div>

    <script>
      document
        .getElementById("adminLoginForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const username = document.getElementById("username").value.trim();
          const password = document.getElementById("password").value;
          const msg = document.getElementById("msg");

          msg.innerText = "";

          try {
            const response = await fetch("/api/login/", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ username, password }),
            });

            const data = await response.json();

            if (!response.ok || !data.access) {
              msg.innerText = data.error || "Login failed.";
              return;
            }

            if (data.role !== "admin") {
              localStorage.clear();
              msg.innerText = "This account is not an admin.";
              return;
            }

            localStorage.setItem("access", data.access);
            localStorage.setItem("token", data.access);
            localStorage.setItem("refresh", data.refresh);
            localStorage.setItem("role", data.role);

            window.location.href = "/admin-dashboard/";
          } catch (error) {
            msg.innerText = "Server communication error.";
          }
        });
    </script>
  </body>
</html>
