{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodOTG | Experience Elegance</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --glass: rgba(25, 25, 25, 0.8);
            --gold: #d4af37; /* Primary Brand Color [cite: 638] */
            --coral: #ff7f50; /* Accent Color from Figma [cite: 590] */
            --error: #ff4d4d;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at top right, #1a150a, transparent);
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            padding: 50px;
            border-radius: 30px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            text-align: center;
            position: relative;
            transition: transform 0.3s ease;
        }

        .brand {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--gold), var(--coral));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline { color: #888; font-size: 0.9rem; margin-bottom: 35px; }

        .input-box { margin-bottom: 20px; text-align: left; }

        input {
            width: 100%;
            padding: 15px;
            background: rgba(255,255,255,0.03);
            border: 1px solid #222;
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            transition: 0.3s;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(255,255,255,0.07);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, var(--gold), var(--coral));
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.4s;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
        }

        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        #msg { color: var(--error); font-size: 0.85rem; height: 20px; margin-bottom: 10px; }

        /* Success State Overlay */
        #success-layer {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            border-radius: 30px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: fadeIn 0.5s forwards;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .check-circle {
            width: 80px; height: 80px;
            border: 3px solid var(--gold);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            color: var(--gold);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="card">
    <div id="success-layer">
        <div class="check-circle">✓</div>
        <h2 style="color: var(--gold); margin: 0;">Success</h2>
        <p style="color: #888;">Registration is Complete</p>
    </div>

    <div class="brand">FoodOTG</div>
    <div class="tagline">Sign up for personalized food discovery [cite: 622]</div>

    <div id="msg"></div>

    <div class="input-box">
        <input type="text" id="name" placeholder="Full Name">
    </div>
    <div class="input-box">
        <input type="email" id="email" placeholder="Email Address">
    </div>
    <div class="input-box">
        <input type="password" id="pass" placeholder="Password">
    </div>
    <div class="input-box">
        <input type="password" id="confirm_pass" placeholder="Confirm Password">
    </div>

    <button class="btn" onclick="executeRegistration()">CREATE ACCOUNT</button>

    <div style="margin-top: 25px; font-size: 0.85rem; color: #666;">
        Already registered? <a href="/login/" style="color: var(--coral); text-decoration: none;">Sign In</a>
    </div>
</div>

<script>
async function executeRegistration() {
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const pass = document.getElementById("pass").value;
    const confirmPass = document.getElementById("confirm_pass").value;
    const msg = document.getElementById("msg");

    msg.innerText = "";

    // Validation checks [cite: 73]
    if (!name || !email || !pass || !confirmPass) {
        msg.innerText = "All fields must be filled.";
        return;
    }
    if (pass !== confirmPass) {
        msg.innerText = "Passwords do not match.";
        return;
    }
    if (pass.length < 6) {
        msg.innerText = "Security requires 6+ characters[cite: 97].";
        return;
    }

    const btn = document.querySelector(".btn");
    btn.innerText = "REGISTERING...";
    btn.disabled = true;

    try {
        const response = await fetch("/api/register/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, password: pass })
        });

        if (response.status === 201) {
            document.getElementById("success-layer").style.display = "flex";
            setTimeout(() => { window.location.href = "/login/"; }, 2000);
        } else {
            const data = await response.json();
            msg.innerText = data.error || "Registration failed.";
            btn.innerText = "CREATE ACCOUNT";
            btn.disabled = false;
        }
    } catch (e) {
        msg.innerText = "Server communication error[cite: 996].";
        btn.innerText = "CREATE ACCOUNT";
        btn.disabled = false;
    }
}
</script>

</body>
</html>
