{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FoodOTG | Admin Panel</title>
    <link
      rel="stylesheet"
      href="{% static 'css/admin_dashboard_styles.css' %}"
    />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div>
          <h2>FoodOTG Admin Panel</h2>
          <p class="subtitle">
            Manage users, moderate reviews, and handle fake review reports.
          </p>
        </div>

        <div class="header-actions">
          <button onclick="processInactiveUsers()">
            Process Inactive Users
          </button>
          <button onclick="logout()">Logout</button>
        </div>
      </div>

      <div class="section">
        <h3>Manage Users</h3>

        <div class="admin-controls">
          <input
            id="userSearch"
            type="text"
            placeholder="Search users..."
            oninput="resetUserPageAndLoad()"
          />
        </div>

        <div id="userList" class="grid"></div>

        <div class="pagination">
          <button onclick="changeUserPage(-1)">Previous</button>
          <span id="userPageLabel">Page 1</span>
          <button onclick="changeUserPage(1)">Next</button>
        </div>
      </div>

      <div class="section">
        <h3>Review Moderation</h3>

        <div class="admin-controls">
          <input
            id="reviewSearch"
            type="text"
            placeholder="Search reviews..."
            oninput="loadAdminDashboard()"
          />
        </div>

        <div id="reviewList" class="grid"></div>
      </div>

      <div class="section">
        <h3>Reported Reviews</h3>

        <div class="admin-controls">
          <select id="reportStatus" onchange="resetReportPageAndLoad()">
            <option value="all">All Reports</option>
            <option value="pending">Pending Reports</option>
            <option value="resolved">Resolved Reports</option>
          </select>
        </div>

        <div id="reportList" class="grid"></div>

        <div class="pagination">
          <button onclick="changeReportPage(-1)">Previous</button>
          <span id="reportPageLabel">Page 1</span>
          <button onclick="changeReportPage(1)">Next</button>
        </div>
      </div>
    </div>

    <script>
      function getAccessToken() {
        return localStorage.getItem("token") || localStorage.getItem("access");
      }

      function authHeaders(extra = {}) {
        return {
          ...extra,
          Authorization: "Bearer " + getAccessToken(),
        };
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      if (!getAccessToken()) {
        window.location.href = "/admin-login/";
      }

      if (localStorage.getItem("role") !== "admin") {
        alert("Access denied. Admins only.");
        window.location.href = "/admin-login/";
      }

      let userPage = 1;
      let reportPage = 1;
      let pageSize = 6;
      let userTotal = 0;
      let reportTotal = 0;

      async function loadAdminDashboard() {
        const userSearch = document.getElementById("userSearch")?.value || "";
        const reviewSearch =
          document.getElementById("reviewSearch")?.value || "";
        const reportStatus =
          document.getElementById("reportStatus")?.value || "all";

        const params = new URLSearchParams({
          user_search: userSearch,
          review_search: reviewSearch,
          report_status: reportStatus,
          user_page: userPage,
          report_page: reportPage,
        });

        const response = await fetch(
          `/api/admin/dashboard/?${params.toString()}`,
          {
            headers: authHeaders(),
          },
        );

        const data = await response.json();

        if (!response.ok) {
          alert(data.error || "Failed to load admin dashboard.");
          return;
        }

        renderUsers(data.users || []);
        renderReviews(data.reviews || []);
        renderReports(data.reports || []);

        userTotal = data.pagination?.user_total || 0;
        reportTotal = data.pagination?.report_total || 0;
        pageSize = data.pagination?.page_size || 6;

        document.getElementById("userPageLabel").innerText = `Page ${userPage}`;
        document.getElementById("reportPageLabel").innerText =
          `Page ${reportPage}`;
      }

      function renderUsers(users) {
        const list = document.getElementById("userList");
        list.innerHTML = "";

        if (!users.length) {
          list.innerHTML = `<div class="card"><p>No users found.</p></div>`;
          return;
        }

        users.forEach((user) => {
          list.innerHTML += `
      <div class="card ${user.is_banned ? "banned" : ""}">
        <h4>${escapeHtml(user.name || user.username)}</h4>
        <p><strong>Email:</strong> ${escapeHtml(user.email)}</p>
        <p><strong>Role:</strong> ${escapeHtml(user.role)}</p>
        <p><strong>Status:</strong> ${user.is_banned ? "Banned" : user.is_active ? "Active" : "Disabled"}</p>
        <p><strong>Last Login:</strong> ${user.last_login ? new Date(user.last_login).toLocaleString() : "Never"}</p>

        <button 
          onclick="toggleUserStatus(${user.id}, ${!user.is_active})"
          ${user.is_banned ? "disabled" : ""}
        >
          ${user.is_active ? "Disable" : "Enable"}
        </button>

        ${
          user.is_banned
            ? `<button class="danger-btn" onclick="unbanUser(${user.id})">Unban User</button>`
            : `<button class="danger-btn" onclick="banUser(${user.id})">Ban User</button>`
        }
      </div>
    `;
        });
      }

      function renderReviews(reviews) {
        const list = document.getElementById("reviewList");
        list.innerHTML = "";

        if (!reviews.length) {
          list.innerHTML = `<div class="card"><p>No reviews found.</p></div>`;
          return;
        }

        reviews.forEach((review) => {
          list.innerHTML += `
      <div class="card">
        <h4>${escapeHtml(review.restaurant_name)}</h4>
        <p><strong>Customer:</strong> ${escapeHtml(review.customer_name)}</p>
        <p><strong>Rating:</strong> ${review.rating}/5</p>
        <p><strong>Comment:</strong> ${escapeHtml(review.comment || "No comment")}</p>
        <p><strong>Status:</strong> ${review.is_approved ? "Approved" : "Hidden"}</p>
        <p><strong>Reports:</strong> ${review.report_count}</p>

        <div class="review-actions">
          <button onclick="toggleReviewStatus(${review.id}, ${!review.is_approved})">
            ${review.is_approved ? "Hide Review" : "Approve Review"}
          </button>

          <button class="danger-btn" onclick="deleteReview(${review.id})">
            Delete Review
          </button>
        </div>
      </div>
    `;
        });
      }

      function renderReports(reports) {
        const list = document.getElementById("reportList");
        list.innerHTML = "";

        if (!reports.length) {
          list.innerHTML = `<div class="card"><p>No reports found.</p></div>`;
          return;
        }

        reports.forEach((report) => {
          list.innerHTML += `
      <div class="card">
        <h4>Report #${report.id}</h4>
        <p><strong>Restaurant:</strong> ${escapeHtml(report.restaurant_name)}</p>
        <p><strong>Reported By:</strong> ${escapeHtml(report.reported_by)}</p>
        <p><strong>Reason:</strong> ${escapeHtml(report.reason)}</p>
        <p><strong>Review:</strong> ${escapeHtml(report.review_comment || "No comment")}</p>
        <p><strong>Status:</strong> ${report.resolved ? "Resolved" : "Pending"}</p>

        ${
          !report.resolved
            ? `
          <button onclick="resolveReport(${report.id})">
            Mark Resolved
          </button>
        `
            : ""
        }
      </div>
    `;
        });
      }

      async function toggleUserStatus(userId, isActive) {
        await fetch(`/api/admin/users/${userId}/status/`, {
          method: "PUT",
          headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ is_active: isActive }),
        });

        loadAdminDashboard();
      }

      async function toggleReviewStatus(reviewId, isApproved) {
        const response = await fetch(`/api/admin/reviews/${reviewId}/status/`, {
          method: "PUT",
          headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ is_approved: isApproved }),
        });

        const data = await response.json();

        if (response.ok) {
          loadAdminDashboard();
        } else {
          alert(data.error || "Failed to update review status.");
        }
      }

      async function deleteReview(reviewId) {
        if (
          !confirm("Are you sure you want to permanently delete this review?")
        )
          return;

        const response = await fetch(`/api/admin/reviews/${reviewId}/delete/`, {
          method: "DELETE",
          headers: authHeaders(),
        });

        const data = await response.json();

        if (response.ok) {
          alert("Review deleted successfully.");
          loadAdminDashboard();
        } else {
          alert(data.error || "Failed to delete review.");
        }
      }

      async function resolveReport(reportId) {
        const response = await fetch(
          `/api/admin/reports/${reportId}/resolve/`,
          {
            method: "PUT",
            headers: authHeaders(),
          },
        );

        const data = await response.json();

        if (response.ok) {
          alert("Report resolved successfully.");
          loadAdminDashboard();
        } else {
          alert(data.error || "Failed to resolve report.");
        }
      }

      async function banUser(userId) {
        if (!confirm("Ban this user and hide all of their reviews?")) return;

        const response = await fetch(`/api/admin/users/${userId}/ban/`, {
          method: "PUT",
          headers: authHeaders(),
        });

        const data = await response.json();

        if (response.ok) {
          alert("User banned successfully.");
          loadAdminDashboard();
        } else {
          alert(data.error || "Failed to ban user.");
        }
      }

      async function unbanUser(userId) {
        if (!confirm("Unban this user and reactivate their account?")) return;

        const response = await fetch(`/api/admin/users/${userId}/unban/`, {
          method: "PUT",
          headers: authHeaders(),
        });

        const data = await response.json();

        if (response.ok) {
          alert("User unbanned successfully.");
          loadAdminDashboard();
        } else {
          alert(data.error || "Failed to unban user.");
        }
      }

      async function processInactiveUsers() {
        if (
          !confirm(
            "Warn users inactive for almost 1 year and disable users inactive for over 1 year?",
          )
        ) {
          return;
        }

        const response = await fetch("/api/admin/users/process-inactive/", {
          method: "POST",
          headers: authHeaders(),
        });

        const data = await response.json();

        if (response.ok) {
          alert(
            `Done. Warned: ${data.warned_count}, Disabled: ${data.disabled_count}`,
          );
          loadAdminDashboard();
        } else {
          alert(data.error || "Failed to process inactive users.");
        }
      }

      function resetUserPageAndLoad() {
        userPage = 1;
        loadAdminDashboard();
      }

      function resetReportPageAndLoad() {
        reportPage = 1;
        loadAdminDashboard();
      }

      function changeUserPage(direction) {
        const maxPage = Math.ceil(userTotal / pageSize) || 1;
        userPage = Math.max(1, Math.min(maxPage, userPage + direction));
        loadAdminDashboard();
      }

      function changeReportPage(direction) {
        const maxPage = Math.ceil(reportTotal / pageSize) || 1;
        reportPage = Math.max(1, Math.min(maxPage, reportPage + direction));
        loadAdminDashboard();
      }

      function logout() {
        localStorage.clear();
        window.location.href = "/admin-login/";
      }

      loadAdminDashboard();
    </script>
  </body>
</html>
