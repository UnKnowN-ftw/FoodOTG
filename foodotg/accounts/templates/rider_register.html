{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FoodOTG | Rider Sign Up</title>
    <link rel="stylesheet" href="{% static 'css/rider_register_styles.css' %}" />
  </head>
  <body>
    <div class="login-container">
      <h2>Rider Sign Up</h2>
      <p id="message" class="error"></p>

      <form id="riderRegisterForm">
        <input type="text" id="name" placeholder="Full Name" required />
        <input type="email" id="email" placeholder="Email Address" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Create Rider Account</button>
      </form>

      <p class="auth-link">
        Already have an account?
        <a href="/login/">Login</a>
      </p>
    </div>

    <script>
      document
        .getElementById("riderRegisterForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const message = document.getElementById("message");

          const response = await fetch("/api/register/", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              name: document.getElementById("name").value,
              email: document.getElementById("email").value,
              password: document.getElementById("password").value,
              role: "rider",
            }),
          });

          const data = await response.json();

          if (response.ok) {
            message.className = "success";
            message.innerText = "Registration successful. Please log in.";
            setTimeout(() => {
              window.location.href = "/rider-login/";
            }, 1000);
          } else {
            message.className = "error";
            message.innerText =
              data.error || Object.values(data).flat().join(" ");
          }
        });
    </script>
  </body>
</html>
