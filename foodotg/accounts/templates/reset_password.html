{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodOTG | Reset Password</title>
    <link rel="stylesheet" href="{% static 'css/reset_password_styles.css' %}">
</head>
<body>

<div class="page-wrapper">
    <div class="card">

        <div class="icon-circle">🔑</div>

        <h2>Reset Your Password</h2>
        <p class="subtitle">
            Enter your new password below.
        </p>

        <div id="msg" class="message"></div>

        <div class="input-group">
            <input type="password" id="password" placeholder="New Password">
        </div>

        <button onclick="resetPass()">Reset Password</button>

        <p class="back-link">
            <a href="/login/">Back to Login</a>
        </p>

    </div>
</div>

<script>
async function resetPass() {
    const password = document.getElementById("password").value;
    const msg = document.getElementById("msg");

    msg.innerText = "";
    msg.className = "message";

    if (!password) {
        msg.innerText = "Please enter a new password.";
        msg.classList.add("error");
        return;
    }

    const url = window.location.pathname.replace(
        "/reset-password/",
        "/api/reset-password/"
    );

    try {
        const res = await fetch(url, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ password })
        });

        const data = await res.json();

        if (res.ok) {
            msg.innerText = "Password reset successful!";
            msg.classList.add("success");
        } else {
            msg.innerText = data.error;
            msg.classList.add("error");
        }

    } catch {
        msg.innerText = "Server communication error.";
        msg.classList.add("error");
    }
}
</script>

</body>
</html>
